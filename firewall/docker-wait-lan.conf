# Installed as /etc/systemd/system/docker.service.d/10-wait-lan.conf.
# nm-online reports the network as online before enp3s0 has carrier. Docker must wait for the static LAN address and
# the default route: without them Caddy cannot bind 192.168.0.111 and the game firewall (so Wings) fails at boot.
[Service]
ExecStartPre=-/usr/bin/timeout 90 /bin/sh -c 'until ip -4 addr show to 192.168.0.111/32 | grep -q inet && ip -4 route show default | grep -q .; do sleep 1; done'
