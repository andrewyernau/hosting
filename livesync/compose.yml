name: livesync

services:
  couchdb:
    image: ${COUCHDB_IMAGE}
    container_name: livesync-couchdb
    user: "5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
      COUCHDB_SECRET: ${COUCHDB_SECRET}
    volumes:
      - ./data:/opt/couchdb/data
      # The official entrypoint writes docker.ini here from COUCHDB_USER and
      # COUCHDB_PASSWORD. Mount only our policy file read-only, not local.d.
      - ./config/livesync.ini:/opt/couchdb/etc/local.d/livesync.ini:ro
    networks:
      - data
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${COUCHDB_USER}:$${COUCHDB_PASSWORD}\" http://127.0.0.1:5984/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  data:
    name: livesync_data
    internal: true
  proxy:
    external: true
    name: selfhost_proxy
