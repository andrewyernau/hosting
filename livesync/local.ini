; Single-node CouchDB for exactly one Self-hosted LiveSync database.
; The service has no host-published port; central Caddy is its only ingress.
[couchdb]
single_node = true

[cluster]
; CouchDB otherwise defaults to three replicas, which cannot be placed on this
; intentionally single-node deployment.
n = 1
q = 1

[chttpd]
bind_address = 0.0.0.0
require_valid_user = true
enable_cors = true
server_header_versions = false

[cors]
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer
max_age = 3600
