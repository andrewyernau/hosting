name: portfolio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: ./source
      dockerfile: api/Dockerfile
      target: runtime
    # The runtime image's working directory is /app/api. Invoke the migration
    # entrypoint directly so this remains independent of Bun script resolution.
    command: ["bun", "src/db/migrate.ts"]
    environment: &api-environment
      APP_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: info
      TRUST_PROXY: "true"
      TRUSTED_PROXY_HOPS: "1"
      TRUSTED_PROXY_ADDRESSES: ""
      COUNTRY_HEADER: x-country-code
      ANALYTICS_HMAC_SECRET: ${ANALYTICS_HMAC_SECRET}
      ANALYTICS_RETENTION_DAYS: "90"
      CONTACT_RETENTION_DAYS: "90"
      CONTACT_RATE_LIMIT_PER_HOUR: "5"
      SMTP_MODE: smtp
      SMTP_HOST: mail.csmak.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TO: ${SMTP_TO}
      OUTBOX_POLL_MS: "1000"
      OUTBOX_MAX_ATTEMPTS: "10"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  api:
    build:
      context: ./source
      dockerfile: api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-environment
    command: ["bun", "run", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app, data]
    security_opt: [no-new-privileges:true]

  mail-worker:
    build:
      context: ./source
      dockerfile: api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-environment
    command: ["bun", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, egress]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: ./source
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    expose: ["8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      app:
        aliases: [portfolio-web]
      proxy:
        aliases: [portfolio-web]
    security_opt: [no-new-privileges:true]

networks:
  app:
    internal: true
  data:
    internal: true
  egress: {}
  proxy:
    name: selfhost_proxy
    external: true
