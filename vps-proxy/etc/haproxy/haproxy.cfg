# vps-proxy: TCP passthrough to the home miniPC over WireGuard (10.66.0.2).
# No TLS is terminated here; certificates stay at home.
global
	log /dev/log local0 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 600 level admin
	user haproxy
	group haproxy
	daemon
	maxconn 4000

defaults
	mode tcp
	log global
	option tcplog
	option dontlognull
	timeout connect 5s
	timeout client 1h
	timeout server 1h
	timeout client-fin 30s
	timeout server-fin 30s
	maxconn 3000

# Web (all Caddy vhosts, any zone). Grey-cloud: open to all with per-IP limits.
frontend web_https
	bind 143.20.32.134:443
	stick-table type ip size 200k expire 60s store conn_cur,conn_rate(10s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc0_conn_cur gt 100 } || { sc0_conn_rate gt 300 }
	default_backend home_https
frontend web_http
	bind 143.20.32.134:80
	stick-table type ip size 200k expire 60s store conn_cur,conn_rate(10s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc0_conn_cur gt 50 } || { sc0_conn_rate gt 150 }
	default_backend home_http
backend home_https
	server home 10.66.0.2:443 send-proxy-v2 check inter 30s
backend home_http
	server home 10.66.0.2:80 send-proxy-v2 check inter 30s

# Wings API/websocket (TLS by Wings) and Wings SFTP. Open to the Internet,
# with a per-source connection budget.
frontend wings_api
	bind 143.20.32.134:8443
	stick-table type ip size 100k expire 60s store conn_cur,conn_rate(10s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc0_conn_cur gt 40 } || { sc0_conn_rate gt 60 }
	default_backend home_wings
frontend wings_sftp
	bind 143.20.32.134:2022
	stick-table type ip size 100k expire 60s store conn_cur,conn_rate(60s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc0_conn_cur gt 8 } || { sc0_conn_rate gt 20 }
	default_backend home_sftp
backend home_wings
	server home 10.66.0.2:8443 check inter 30s
backend home_sftp
	server home 10.66.0.2:2022 check inter 30s

# Game allocations (Calagopus 25550-25580, except 25565). Same port at home: the server line has no port.
frontend games
	# 25565 belongs to mc-router (hostname routing).
	bind 143.20.32.134:25550-25564,143.20.32.134:25566-25580
	stick-table type ip size 100k expire 60s store conn_cur,conn_rate(10s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc0_conn_cur gt 10 } || { sc0_conn_rate gt 20 }
	default_backend home_games
backend home_games
	server home 10.66.0.2

# Mail: TCP passthrough to Stalwart (TLS terminates at home), PROXY v2 so it sees the client IP.
frontend mail_smtp
	bind 143.20.32.134:25
	timeout client 10m
	stick-table type ip size 100k expire 60s store conn_cur,conn_rate(60s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc0_conn_cur gt 10 } || { sc0_conn_rate gt 60 }
	default_backend home_smtp
frontend mail_clients
	bind 143.20.32.134:465,143.20.32.134:587,143.20.32.134:993
	stick-table type ip size 100k expire 60s store conn_cur,conn_rate(60s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc0_conn_cur gt 20 } || { sc0_conn_rate gt 30 }
	default_backend home_mail_clients
backend home_smtp
	timeout server 10m
	server home 10.66.0.2:25 send-proxy-v2
backend home_mail_clients
	# No port: same port as the client used (465/587/993).
	server home 10.66.0.2 send-proxy-v2

# Outbound relay for Stalwart: the VPS IP is what Resend sees. TLS stays end to end.
resolvers sys
	parse-resolv-conf
	hold valid 300s
frontend relay_resend
	bind 10.66.0.1:2465
	timeout client 10m
	default_backend resend_smtps
backend resend_smtps
	timeout server 10m
	# resolve-prefer ipv4: smtp.resend.com is a CNAME to an IPv4-only AWS ELB (since 2026-11-13); with the default
	# (ipv6) every AAAA answer is a cname_error and the server stays in MAINT (resolution).
	server resend smtp.resend.com:465 resolvers sys resolve-prefer ipv4 init-addr libc,last check inter 60s

# Prometheus exporter, loopback only (reached through the metrics-tunnel SSH user).
frontend metrics
	mode http
	bind 127.0.0.1:8405
	http-request use-service prometheus-exporter if { path /metrics }
	http-request deny
