#!/usr/sbin/nft -f
# vps-proxy firewall. Default deny; only the edge services the home miniPC publishes.
flush ruleset

include "/etc/nftables.d/tunnel.nft"

table inet filter {
	set cloudflare_v4 {
		type ipv4_addr; flags interval
		include "/etc/nftables.d/cloudflare-v4.nft"
	}

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept

		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
		meta l4proto ipv6-icmp accept

		# SSH: key-only in sshd; rate-limit new connections per source.
		tcp dport 22 ct state new meter ssh_v4 { ip saddr limit rate 6/minute burst 4 packets } accept
		tcp dport 22 ct state new drop

		# WireGuard: the home miniPC dials in.
		udp dport 51820 accept

		include "/etc/nftables.d/services.nft"

		limit rate 5/minute log prefix "nft-drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		# Game UDP only, after the DNAT in "table ip nat"; per-source budget on new flows.
		iifname "eth0" oifname "wg0" ip daddr $HOME_EDGE udp dport $GAME_UDP_PORTS ct state new meter games_udp_v4 { ip saddr limit rate 60/minute burst 30 packets } accept
		limit rate 5/minute log prefix "nft-drop-fwd: " level info
	}

	chain output {
		type filter hook output priority filter; policy accept;
		# The VPS may only open the published home ports through the tunnel.
		oifname "wg0" ct state established,related accept
		oifname "wg0" ip daddr $HOME_EDGE tcp dport $HOME_PORTS accept
		oifname "wg0" ip daddr $HOME_EDGE icmp type echo-request accept
		oifname "wg0" drop
	}
}

# HAProxy cannot relay UDP, so game UDP is forwarded at L3. The home tunnel end only routes
# replies to 10.66.0.1, hence the masquerade (games see the tunnel address, as with TCP).
table ip nat {
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		iifname "eth0" ip daddr $VPS_PUBLIC udp dport $GAME_UDP_PORTS dnat to $HOME_EDGE
	}
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "wg0" ip daddr $HOME_EDGE udp dport $GAME_UDP_PORTS masquerade
	}
}
